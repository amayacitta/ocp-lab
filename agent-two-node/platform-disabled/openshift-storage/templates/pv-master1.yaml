{{- if .Values.chart.enabled }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: master1-local-nvme
spec:
  capacity:
    storage: 500Gi
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
  storageClassName: localblock
  volumeMode: Block
  local:
    path: /dev/nvme1n1
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - master1
{{ end -}}