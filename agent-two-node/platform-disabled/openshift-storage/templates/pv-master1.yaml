{{- if .Values.chart.enabled }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: master1-local-nvme-1tb
spec:
  capacity:
    storage: 900Gi
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
  storageClassName: localblock
  volumeMode: Block
  local:
    path: /dev/disk/by-id/nvme-Samsung_SSD_990_EVO_Plus_1TB_S7U4NU1Y926191Z
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - master1
{{ end -}}