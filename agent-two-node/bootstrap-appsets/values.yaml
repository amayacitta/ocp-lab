chart:
  enabled: true

clusters:
  selector:
    matchLabels:
      bootstrap.amayacitta.co.uk/enabled: "true"

# AppSet settings.
appset:
  platform:
    enabled: true
    namespace: openshift-gitops
    project: default
    annotations:
      argocd.argoproj.io/compare-options: ServerSideDiff=true
    git:
      repoURL: https://github.com/amayacitta/ocp-lab.git
      path: agent-two-node/platform/*
      targetRevision: main
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
      automated:
        enabled: false
        prune: true
        selfHeal: true
      retry:
        limit: 5
        backoff:
          duration: 5s
          factor: 2
          maxDuration: 3m

  apps:
    enabled: true
    namespace: openshift-gitops
    project: default
    annotations:
      argocd.argoproj.io/compare-options: ServerSideDiff=true
    git:
      repoURL: https://github.com/amayacitta/ocp-lab.git
      path: agent-two-node/apps/*
      targetRevision: main
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
      automated:
        enabled: true
        prune: true
        selfHeal: true
      retry:
        limit: 5
        backoff:
          duration: 5s
          factor: 2
          maxDuration: 3m