chart:
  enabled: true

clusters:
  selector:
    matchLabels:
      type: openshift
      env: dev

# AppSet settings.
appset:
  platform:
    enabled: true
    namespace: openshift-gitops
    project: default
    git:
      repoURL: https://github.com/amayacitta/ocp-lab.git
      path: agent-two-node/platform/*
      targetRevision: main
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
      automated:
        enabled: false
        prune: false
        selfHeal: false
      retry:
        limit: 5
        backoff:
          duration: 5s
          factor: 2
          maxDuration: 3m

  apps:
    enabled: true
    namespace: openshift-gitops
    project: default
    git:
      repoURL: https://github.com/amayacitta/ocp-lab.git
      path: agent-two-node/apps/*
      targetRevision: main
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
      automated:
        enabled: false
        prune: false
        selfHeal: false
      retry:
        limit: 5
        backoff:
          duration: 5s
          factor: 2
          maxDuration: 3m