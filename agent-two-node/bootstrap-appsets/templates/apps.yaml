{{- if and .Values.chart.enabled .Values.appset.apps.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: openshift-apps
  namespace: {{ .Values.appset.apps.namespace }}
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - matrix:
      generators:
        - git:
            repoURL: {{ .Values.appset.apps.git.repoURL | quote }}
            revision: {{ .Values.appset.apps.git.targetRevision | quote }}
            directories:
            - path: {{ .Values.appset.apps.git.path | quote }}
        - clusters:
            selector:
{{- toYaml (required "clusters.selector is required" .Values.clusters.selector) | nindent 14 }}
  template:  
    metadata:
      name: {{ printf "{{.nameNormalized}}-{{ base .path.path }}" | quote }}
      annotations:
        argocd.argoproj.io/compare-options: ServerSideDiff=true
    spec:
      project: {{ .Values.appset.apps.project | quote }}
      source:
        repoURL: {{ .Values.appset.apps.git.repoURL | quote }}
        targetRevision: {{ .Values.appset.apps.git.targetRevision | quote }}
        path: {{ printf "{{.path.path}}" | quote }}
        helm:
          valueFiles:
            - {{ printf "{{ index .metadata.annotations \"bootstrap.amayacitta.co.uk/helm-values-file\" }}" | quote }}
      destination:
        server: {{ printf "{{.server}}" | quote }}
        namespace: '{{ printf "{{ base .path.path }}" }}'
{{- with .Values.appset.apps.syncPolicy }}
      syncPolicy:
{{- toYaml . | nindent 8 }}
{{- end }}
{{ end -}}