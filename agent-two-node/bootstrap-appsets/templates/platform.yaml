{{- if and .Values.argocd.enabled .Values.argocd.applicationset.bootstrap.platform.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: openshift-platform
  namespace: {{ .Values.argocd.applicationset.bootstrap.platform.namespace }}
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - matrix:
      generators:
        - git:
            repoURL: {{ .Values.argocd.applicationset.bootstrap.platform.git.repoURL | quote }}
            revision: {{ .Values.argocd.applicationset.bootstrap.platform.git.targetRevision | quote }}
            directories:
            - path: {{ .Values.argocd.applicationset.bootstrap.platform.git.path | quote }}
        - clusters:
            selector:{{ toYaml (required "argocd.clusters.rhocp01.selector is required" .Values.argocd.clusters.rhocp01.selector) | nindent 14 }}
  template:
    metadata:
      name: {{ include "vks-bootstrap.generatedApplicationName" . }}
    spec:
      project: {{ .Values.argocd.applicationset.bootstrap.platform.project | quote }}
      source:
        repoURL: {{ .Values.argocd.applicationset.bootstrap.platform.git.repoURL | quote }}
        targetRevision: {{ .Values.argocd.applicationset.bootstrap.platform.git.targetRevision | quote }}
        path: {{ printf "{{.path.path}}" | quote }}
        helm:
          valueFiles:
            - {{ .Values.argocd.clusters.rhocp01.helmValuesFile | quote }}
      destination:
        server: {{ printf "{{.server}}" | quote }}
        namespace: '{{ printf "{{ base .path.path }}" }}'
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
        automated:
          enabled: true
          prune: {{ .Values.argocd.applicationset.bootstrap.platform.syncPolicy.prune }}
          selfHeal: false
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
{{ end -}}