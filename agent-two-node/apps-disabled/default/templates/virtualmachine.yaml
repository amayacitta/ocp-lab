{{ if .Values.chart.enabled -}}
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: rhel-demo-vm-01
  labels:
    app: rhel-demo-vm-01 
spec:    
    running: true
    template:
      # metadata:
      #   annotations:
      #     descheduler.alpha.kubernetes.io/evict: "true"
      spec:
        domain:
          cpu:
            cores: 4
            sockets: 1
            threads: 1
          memory:
            guest: 4Gi    # memory assiged to the guest 
          devices:
            disks:
            - disk:
                bus: virtio
              name: vm-rootdisk
            - disk:
                bus: virtio
              name: cloudinitdisk
            interfaces:
            - masquerade: {}
              name: default
            rng: {}
          features:
            smm:
              enabled: true
          firmware:
            bootloader:
              efi: {}
          resources:
            requests:
              memory: 3Gi     # memory used for scheduling
        evictionStrategy: LiveMigrate
        networks:
        - name: default
          pod: {}
        volumes:
        - persistentVolumeClaim:
              claimName: rhel-demo-vm-01-disk
          name: vm-rootdisk
        - cloudInitNoCloud:
            userData: |-
              #cloud-config
              user: cloud-user
              password: 'redhat1234' 
              chpasswd: { expire: False }
          name: cloudinitdisk
{{ end -}}