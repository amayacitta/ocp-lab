{{ if .Values.chart.enabled -}}
apiVersion: operator.openshift.io/v1
kind: Console
metadata:
  name: cluster
spec:
  managementState: Managed
  plugins:
    - networking-console-plugin
    - monitoring-plugin
    - kubevirt-plugin
    - gitops-plugin
    - node-remediation-console-plugin
    - nmstate-console-plugin
    - netobserv-plugin	
    - netobserv-plugin-static
{{ end -}}