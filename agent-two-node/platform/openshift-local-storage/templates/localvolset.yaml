{{- if .Values.chart.enabled }}
apiVersion: local.storage.openshift.io/v1alpha1
kind: LocalVolumeSet
metadata:
  name: samsung-nvme-1tb
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "10"
spec:
  nodeSelector:
    nodeSelectorTerms:
      - matchExpressions:
          - key: node-role.kubernetes.io/worker
            operator: Exists
  storageClassName: samsung-nvme-1tb
  volumeMode: Blok
  # fsType: ext4
  maxDeviceCount: 1
  deviceInclusionSpec:
    deviceMechanicalProperties:
      - NonRotational
    deviceTypes:
      - disk
    minSize: 900Gi
    maxSize: 1100Gi
    models: 
      - "Samsung SSD 990 EVO Plus 1TB"
{{ end -}}