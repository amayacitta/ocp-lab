{{- if .Values.chart.enabled }}
apiVersion: local.storage.openshift.io/v1
kind: LocalVolume
metadata:
  name: local-nvme-master0
  namespace: openshift-local-storage
spec:
  logLevel: Normal
  managementState: Managed
  nodeSelector:
    nodeSelectorTerms:
      - matchExpressions:
          - key: kubernetes.io/hostname
            operator: In
            values: 
              - master0
  storageClassDevices:
    - devicePaths:
        - /dev/disk/by-id/nvme-Samsung_SSD_990_EVO_Plus_1TB_S7U4NJ0XB17122Z
      fsType: ext4
      storageClassName: local-nvme-1tb-master0
      volumeMode: Filesystem
---
apiVersion: local.storage.openshift.io/v1
kind: LocalVolume
metadata:
  name: local-nvme-master1
  namespace: openshift-local-storage
spec:
  logLevel: Normal
  managementState: Managed
  nodeSelector:
    nodeSelectorTerms:
      - matchExpressions:
          - key: kubernetes.io/hostname
            operator: In
            values: 
              - master1
  storageClassDevices:
    - devicePaths:
        - /dev/disk/by-id/nvme-Samsung_SSD_990_EVO_Plus_1TB_S7U4NU1Y926191Z
      fsType: ext4
      storageClassName: local-nvme-1tb-master1
      volumeMode: Filesystem
{{ end -}}