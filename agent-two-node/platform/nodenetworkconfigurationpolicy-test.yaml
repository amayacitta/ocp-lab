          bridge: br-ex                    # Using the same default bridge interface not a dedicated bond
          state: present
        - localnet: localnet-vlan-103      # This is what has to attach to the NAD
          bridge: br-ex                    # Using the same default bridge interface not a dedicated bond
          state: present
        - localnet: localnet-vlan-104      # This is what has to attach to the NAD
          bridge: br-ex                    # Using the same default bridge interface not a dedicated bond
          state: present
        - localnet: localnet-vlan-105      # This is what has to attach to the NAD
          bridge: br-ex                    # Using the same default bridge interface not a dedicated bond
          state: present
        - localnet: localnet-vlan-106      # This is what has to attach to the NAD
          bridge: br-ex                    # Using the same default bridge interface not a dedicated bond
          state: present
        - localnet: localnet-vlan-107      # This is what has to attach to the NAD
          bridge: br-ex                    # Using the same default bridge interface not a dedicated bond
          state: present
        - localnet: localnet-vlan-109      # This is what has to attach to the NAD
