apiVersion: nmstate.io/v1
kind: NodeNetworkConfigurationPolicy
metadata:
  name: bond0-lan-nncp
spec:
  nodeSelector: 
    kubernetes.io/hostname: master1
    # node-role.kubernetes.io/worker: ""
    # node-role.kubernetes.io/master: ""
