chart:
  enabled: true

nodeConfig:
  enabled: true

  nodes:
    master0:
      disks:
        - name: nvme-1tb
          path: /dev/disk/by-id/nvme-Samsung_SSD_990_EVO_Plus_1TB_S7U4NJ0XB17122Z
          diskType: block
          allowScheduling: true
          storageReserved: 0
          tags:
            - nvme

        - name: nvme-2tb
          path: /dev/disk/by-id/nvme-Samsung_SSD_990_EVO_2TB_S7GDNS0X223156Z
          diskType: block
          allowScheduling: true
          storageReserved: 0
          tags:
            - nvme

    master1:
      disks:
        - name: nvme-1tb
          path: /dev/disk/by-id/nvme-Samsung_SSD_990_EVO_Plus_1TB_S7U4NU1Y926191Z
          diskType: block
          allowScheduling: true
          storageReserved: 0
          tags:
            - nvme

        - name: nvme-2tb
          path: /dev/disk/by-id/nvme-Samsung_SSD_990_EVO_2TB_S7GDNS0X223152V
          diskType: block
          allowScheduling: true
          storageReserved: 0
          tags:
            - nvme

longhorn:
  preUpgradeChecker:
    jobEnabled: false

  image:
    openshift:
      oauthProxy: 
        registry: quay.io
        repository: openshift/origin-oauth-proxy
        tag: "5.0"    # skopeo list-tags docker://quay.io/openshift/origin-oauth-proxy | sort

  persistence:
    defaultClassReplicaCount: 2

    defaultDiskSelector:
      enable: true
      selector: "nvme"

    dataEngine: v2

  defaultSettings:
    v1DataEngine: false
    v2DataEngine: true
    createDefaultDiskLabeledNodes: true
    dataEngineHugepageEnabled: true

  openshift:
    enabled: true
    ui:
      route: "longhorn-ui"
      port: 443
      proxy: 8443