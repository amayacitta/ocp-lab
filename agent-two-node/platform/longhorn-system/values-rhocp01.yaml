chart:
  enabled: true

longhorn:
  preUpgradeChecker:
    jobEnabled: false

  image:
    openshift:
      oauthProxy: 
        registry: quay.io
        repository: openshift/origin-oauth-proxy
        tag: "5.0"    # skopeo list-tags docker://quay.io/openshift/origin-oauth-proxy | sort

  persistence:
    defaultClassReplicaCount: 2

    defaultDiskSelector:
      enable: true
      selector: "nvme"

    dataEngine: v2

  defaultSettings:
    v1DataEngine: false
    v2DataEngine: true
    createDefaultDiskLabeledNodes: true
    dataEngineHugepageEnabled: true

  openshift:
    enabled: true
    ui:
      route: "longhorn-ui"
      port: 443
      proxy: 8443