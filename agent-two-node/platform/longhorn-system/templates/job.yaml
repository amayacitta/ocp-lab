{{- if and .Values.chart.enabled .Values.nodeConfig.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: longhorn-node-config
  namespace: {{ .Release.Namespace }}
  annotations: 
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-10"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: longhorn-node-config
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-10"
rules:
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - get
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: longhorn-node-config
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-10"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: longhorn-node-config
subjects:
  - kind: ServiceAccount
    name: longhorn-node-config
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: longhorn-node-config
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: longhorn-node-config
      containers:
        - name: configure
          image: registry.redhat.io/openshift4/ose-cli:latest
          command:
            - /bin/bash
            - -ec
            - |
              {{- range $nodeName, $node := .Values.nodeConfig.nodes }}

              echo "Configuring node {{ $nodeName }}"

              oc label node {{ $nodeName }} \
                node.longhorn.io/create-default-disk=config \
                --overwrite

              oc annotate node {{ $nodeName }} \
                'node.longhorn.io/default-disks-config={{ $node.disks | toJson }}' \
                --overwrite

              {{- end }}
{{- end }}