{{- if .Values.chart.enabled }}
apiVersion: hco.kubevirt.io/v1beta1
kind: HyperConverged
metadata:
  name: kubevirt-hyperconverged
  namespace: {{ .Values.kubevirt.namespace }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    kubevirt.kubevirt.io/jsonpatch: '[{"op":"add","path":"/spec/configuration/developerConfiguration/featureGates/-","value":"Template"}]'      ## enable native VM templates
spec:
  enableCommonBootImageImport: true
  virtualMachineOptions:
    disableFreePageReporting: false
    disableSerialConsoleLog: false
  higherWorkloadDensity:
    memoryOvercommitPercentage: 100
  enableApplicationAwareQuota: false
  infra: {}
  ksmConfiguration: {}
  evictionStrategy: LiveMigrate
  featureGates:
    #decentralizedLiveMigration: true  # cross cluster migration in preview
    incrementalBackup: false  # incrimental backup in preview
    enableMultiArchBootImageImport: false
    downwardMetrics: false
    disableMDevConfiguration: false
    declarativeHotplugVolumes: false
    deployKubeSecondaryDNS: false
    objectGraph: false
    alignCPUs: false
    containerPathVolumes: false
    persistentReservation: false
    videoConfig: true
  resourceRequirements:
    vmiCPUAllocationRatio: 10
{{ end -}}