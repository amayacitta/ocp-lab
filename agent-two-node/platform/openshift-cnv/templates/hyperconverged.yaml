{{- if .Values.chart.enabled }}
apiVersion: hco.kubevirt.io/v1
kind: HyperConverged
metadata:
  name: kubevirt-hyperconverged
  namespace: {{ .Values.kubevirt.namespace }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "10"
    kubevirt.kubevirt.io/jsonpatch: '[{"op":"add","path":"/spec/configuration/developerConfiguration/featureGates/-","value":"Template"}]'      ## enable native VM templates
spec:
  featureGates:
    - name: incrementalBackup
      state: Disabled
    - name: enableMultiArchBootImageImport
      state: Disabled
    - name: downwardMetrics
      state: Disabled
    - name: declarativeHotplugVolumes
      state: Enabled
    - name: deployKubeSecondaryDNS
      state: Disabled
    - name: objectGraph
      state: Disabled
    - name: alignCPUs
      state: Disabled
    - name: containerPathVolumes
      state: Disabled
    - name: persistentReservation
      state: Disabled
  virtualization:
    evictionStrategy: LiveMigrate
    higherWorkloadDensity:
      memoryOvercommitPercentage: 150   # memory density
    liveMigrationConfig:
      allowAutoConverge: false
      allowPostCopy: false
      allowWorkloadDisruption: false
      completionTimeoutPerGiB: 20
      parallelMigrationsPerCluster: 5
      parallelOutboundMigrationsPerNode: 1
      progressTimeout: 150
    mediatedDevicesConfiguration:
      enabled: true
    virtualMachineOptions:
      disableFreePageReporting: false
      disableSerialConsoleLog: false
    vmiCPUAllocationRatio: 10
    workloadUpdateStrategy:
      workloadUpdateMethods:
      - LiveMigrate
  workloadSources:
    enableCommonBootImageImport: true
{{ end -}}