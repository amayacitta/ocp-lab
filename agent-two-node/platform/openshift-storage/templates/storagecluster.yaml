{{- if .Values.chart.enabled }}
apiVersion: ocs.openshift.io/v1
kind: StorageCluster
metadata:
  name: two-node-arbiter
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "20"
spec:
  monDataDirHostPath: /var/lib/rook
  flexibleScaling: true
  placement:
    mon:
     tolerations:
     - key: "node-role.kubernetes.io/arbiter"
       operator: Exists
       effect: "NoSchedule"
     - key: "node-role.kubernetes.io/master"
       operator: Exists
       effect: "NoSchedule"
  managedResources:
    cephBlockPools:
      poolSpec:
        replicated:
          size: 2
    cephFilesystems:
      metadataPoolSpec: {replicated: {size: 2}}
      dataPoolSpec: {replicated: {size: 2}}
    cephCluster:
      cephConfig:
        global:
          osd_pool_default_size: "2"
  storageDeviceSets:
    - name: nvme
      count: 1
      replica: 2
      dataPVCTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 900Gi
          storageClassName: samsung-nvme-1tb
          volumeMode: Block
{{ end -}}