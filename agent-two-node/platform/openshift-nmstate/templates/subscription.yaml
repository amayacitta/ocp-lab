{{- if .Values.chart.enabled }}
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: kubernetes-nmstate-operator
  namespace: {{ .Values.nmstate.namespace }}
spec:
  channel: {{ .Values.nmstate.channel }}
