{{- if .Values.chart.enabled }}
apiVersion: k8s.ovn.org/v1
kind: ClusterUserDefinedNetwork
metadata:
  name: vlan-101
spec:
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: default    # cluster wide network available to all namespaces if placed here
  network:
    localnet:
      ipam:
        mode: Disabled    # maclvan
      mtu: 1500
      physicalNetworkName: br-ex-network    # bind to default physical bridge
      role: Secondary    # localnet must be secondary
      vlan:
        access:
          id: 101
        mode: Access     # can only be access
    topology: Localnet
---
apiVersion: k8s.ovn.org/v1
kind: ClusterUserDefinedNetwork
metadata:
  name: vlan-109
spec:
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: default
  network:
    localnet:
      ipam:
        mode: Disabled
      mtu: 1500
      physicalNetworkName: br-ex-network
      role: Secondary
      vlan:
        access:
          id: 109
        mode: Access
    topology: Localnet
{{ end -}}