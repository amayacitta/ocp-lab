{{- if .Values.chart.enabled }}
apiVersion: k8s.ovn.org/v1
kind: ClusterUserDefinedNetwork
metadata:
  name: vlan-109
spec:
  namespaceSelector:
    matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: In
        values:
          - default
  network:
    localnet:
      ipam:
        mode: Disabled
      mtu: 1500
      physicalNetworkName: br-ex-network
      role: Secondary
      vlan:
        access:
          id: 109
        mode: Access
    topology: Localnet
{{ end -}}