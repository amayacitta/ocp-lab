{{- if .Values.chart.enabled }}
apiVersion: lvm.topolvm.io/v1alpha1
kind: LVMCluster
metadata:
  name: nvme-lvm-cluster
spec:
  storage:
    deviceClasses:
      - default: true
        deviceDiscoveryPolicy: Dynamic
        deviceSelector:
          forceWipeDevicesAndDestroyAllData: true
          paths:
            - /dev/nvme0n1
            - /dev/nvme2n1
        fstype: xfs
        name: nvme-local-lvm-thin
        nodeSelector:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/worker
                  operator: Exists
        storageClassOptions:
          additionalParameters: {}
          reclaimPolicy: Delete
          volumeBindingMode: Immediate
        thinPoolConfig:
          chunkSizeCalculationPolicy: Static
          metadataSizeCalculationPolicy: Host
          name: thin-pool-01
          overprovisionRatio: 10
          sizePercent: 90
{{ end -}}