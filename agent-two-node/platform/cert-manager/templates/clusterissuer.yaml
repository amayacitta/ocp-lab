{{- if .Values.chart.enabled }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{.Values.certmanager.ClusterIssuer.name | default "ocp-sub01-clusterissuer" }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "10"
spec:
  ca:
    secretName: {{ .Values.certmanager.ClusterIssuer.secretName | default "ocp-sub01-tls-secret" }}
{{ end -}}