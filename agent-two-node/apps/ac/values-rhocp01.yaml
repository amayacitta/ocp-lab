chart:
  enabled: true

## array of import source images
## skopeo list-tags docker://registry.redhat.io/rhel9/rhel-guest-image | sort
## skopeo list-tags docker://registry.redhat.io/rhel10/rhel-guest-image | sort
importSources:
  - name: rhel9
    url: docker://registry.redhat.io/rhel9/rhel-guest-image:9.9
    pullMethod: node

  - name: rhel10
    url: docker://registry.redhat.io/rhel10/rhel-guest-image:10.3
    pullMethod: node

## vm defaults
defaults:
  storageClass: longhorn
  accessMode: ReadWriteMany
  volumeMode: Filesystem
  importSource: rhel10

  cpu:
    sockets: 1
    cores: 4
    threads: 1

  memory:
    guest: 4Gi
    request: 3Gi

  diskBus: virtio

  evictionStrategy: LiveMigrate

vms:
  - name: rhel-demo-vm-01
    image:
      url: docker://registry.redhat.io/rhel9/rhel-guest-image:9.3-870
      pullMethod: node
    disk:
      size: 30Gi
    cloudInit:
      enabled: true
      user: cloud-user
      password: redhat1234
