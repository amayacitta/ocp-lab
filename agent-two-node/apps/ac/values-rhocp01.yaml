chart:
  enabled: true

## array of import source images
## skopeo list-tags docker://registry.redhat.io/rhel9/rhel-guest-image | sort
## skopeo list-tags docker://registry.redhat.io/rhel10/rhel-guest-image | sort
importSources:
  - name: rhel9
    url: docker://registry.redhat.io/rhel9/rhel-guest-image:9.9
    pullMethod: node
  - name: rhel10
    url: docker://registry.redhat.io/rhel10/rhel-guest-image:10.3
    pullMethod: node

## vm defaults can be overridden by placing values in the array of vms
defaults:
  storageClass: longhorn
  accessMode: ReadWriteMany
  volumeMode: Block
  importSource: rhel10
  cpu:
    sockets: 1
    cores: 4
    threads: 1
  memory:
    guest: 4Gi
    request: 3Gi
  disk:
    size: 30Gi
  diskBus: virtio
  evictionStrategy: LiveMigrate

## array of vms
## enter specific values when you want to override the defaults
vms: {}
