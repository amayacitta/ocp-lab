{{- if .Values.chart.enabled }}
{{- range .Values.vms }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .name }}-disk
spec:
  storageClassName: {{ .disk.storageClass | default $.Values.defaults.storageClass }}
  dataSourceRef:
    apiGroup: cdi.kubevirt.io
    kind: VolumeImportSource
    name: {{ .importSource | default $.Values.defaults.importSource }}
  accessModes:
    - {{ .disk.accessMode | default $.Values.defaults.accessMode | default "ReadWriteMany" }}
  volumeMode: {{ .disk.volumeMode | default $.Values.defaults.volumeMode | default "Filesystem" }}
  resources:
    requests:
      storage: {{ .disk.size | default $.Values.defaults.disk.size }}
{{- end }}
{{- end }}