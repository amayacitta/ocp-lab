{{ if .Values.chart.enabled -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rhel-demo-vm-01-disk
spec:
  storageClassName: longhorn
  dataSourceRef:
    apiGroup: cdi.kubevirt.io
    kind: VolumeImportSource
    name: rhel-10-import-source
  accessModes:
    - ReadWriteMany
  volumeMode: Filesystem # Block | Filesystem
  resources:
    requests:
      storage: 30Gi
---
