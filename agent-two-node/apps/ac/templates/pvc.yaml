{{- if .Values.chart.enabled }}
{{- range .Values.vms }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .name }}-disk
spec:
  storageClassName: {{ .disk.storageClass | default $.Values.defaults.storageClass }}
  dataSourceRef:
    apiGroup: cdi.kubevirt.io
    kind: VolumeImportSource
    name: {{ .name }}-import-source

  accessModes:
    - {{ .disk.accessMode | default $.Values.defaults.accessMode }}

  volumeMode: {{ .disk.volumeMode | default $.Values.defaults.volumeMode }}

  resources:
    requests:
      storage: {{ .disk.size }}
{{- end }}
{{- end }}