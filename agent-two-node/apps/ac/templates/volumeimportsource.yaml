{{- if .Values.chart.enabled }}
{{- range $name, $source := .Values.importSources }}
---
apiVersion: cdi.kubevirt.io/v1beta1
kind: VolumeImportSource
metadata:
  name: {{ $source.name }}
spec:
  source:
    registry:
      url: {{ $source.url | quote }}
      pullMethod: {{ $source.pullMethod | default "node" }}
{{- end }}
{{- end }}