## podman search --list-tags registry.redhat.io/rhel9/rhel-guest-image --tls-verify=false
{{- if .Values.chart.enabled }}
{{- range .Values.vms }}
---
apiVersion: cdi.kubevirt.io/v1beta1
kind: VolumeImportSource
metadata:
  name: {{ .name }}-import-source
spec:
  source:
    registry:
      url: {{ .image.url | quote }}
      pullMethod: {{ .image.pullMethod | default "node" }}
{{- end }}
{{- end }}