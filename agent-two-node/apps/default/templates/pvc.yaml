{{ if .Values.chart.enabled -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rhel-demo-vm-01-disk
spec:
  storageClassName: local-nvme-nvme2n1-workers
  dataSourceRef:
    apiGroup: cdi.kubevirt.io
    kind: VolumeImportSource
    name: rhel-demo-vm-01-import-source
  accessModes:
    - ReadWriteOnce
  volumeMode: Block
  resources:
    requests:
      storage: 30Gi
{{ end -}}