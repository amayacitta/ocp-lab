{{ if .Values.chart.enabled -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rhel-demo-vm-01-disk
spec:
  storageClassName: lvms-nvme-local-lvm-thin
  dataSourceRef:
    apiGroup: cdi.kubevirt.io
    kind: VolumeImportSource
    name: rhel-demo-vm-01-import-source
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem # Block | Filesystem
  resources:
    requests:
      storage: 30Gi
{{ end -}}